name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - staging
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks scan
        run: |
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --verbose --redact
          else
            gitleaks detect --verbose --redact
          fi

      - name: Run npm ci
        run: npm ci

      - name: Run npm run typecheck
        run: npm run typecheck

      - name: Run npm run lint
        run: npm run lint

      - name: Run npm run lint:test-rules
        run: npm run lint:test-rules

      - name: Run npm run format:check
        run: npm run format:check

      - name: Run npm run build
        run: npm run build
